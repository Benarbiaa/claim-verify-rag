# Pipeline configuration: which implementation each stage uses, and its settings.
# Secrets (API keys, database URL) stay in .env.
#
# The shape of this file is checked at startup (src/claimverify/settings.py):
# an unknown key, stage type or provider stops the run with a clear message.
# For an experiment, copy this file and run with --config <copy>.

providers:                       # LLM endpoints; each names the .env variable holding its key
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    max_retries: 6              # new attempts after a rate-limit or server error
    max_wait_seconds: 60        # a longer requested wait (e.g. daily limit) stops the run
    timeout_seconds: 120        # one request's maximum duration
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    max_retries: 6              # new attempts after a rate-limit or server error
    max_wait_seconds: 60        # a longer requested wait (e.g. daily limit) stops the run
    timeout_seconds: 120        # one request's maximum duration

embedding:                       # shared by both pipelines: chunks and queries MUST use the same model
  type: bge
  model: BAAI/bge-base-en-v1.5
  device: cuda

indexing:
  loader:
    type: files
  cleaner:                       # minimal: repairs PDF extraction (page numbers, NFKC,
    type: minimal                #   split words); none: raw text, for comparison
  chunker:
    type: fixed_size
    chunk_size: 400              # tokens of the embedding model (bge reads at most 510)
    overlap_ratio: 0.15

answering:
  retriever:                     # used by the drafter
    type: hybrid                 # pgvector: by meaning only; hybrid: meaning + exact words (BM25)
    top_k_per_doc: 2
    rerank:                      # optional: a cross-encoder rereads the candidates (local model)
      model: BAAI/bge-reranker-base
      candidates: 10             # passages per document reread; the best top_k_per_doc are kept
      device: cuda
  drafter:
    type: llm
    provider: groq
    model: openai/gpt-oss-120b
  decomposer:
    type: llm
    provider: groq
    model: openai/gpt-oss-120b
  verifier:
    type: langgraph
    retriever:                   # its own retriever: can differ from the drafter's
      type: hybrid               # make eval-retrieval, proof seen: pgvector 23/44, hybrid 31, + rerank 37
      top_k_per_doc: 2
      rerank:
        model: BAAI/bge-reranker-base
        candidates: 10
        device: cuda
    judge:                       # a different model family from the drafter, on purpose
      type: llm
      provider: groq
      model: qwen/qwen3.8-27b

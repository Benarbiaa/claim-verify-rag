[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimverify"
version = "0.1.0"
description = "Agentic RAG that decomposes its own answers into atomic claims and fact-checks each one against the full corpus."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Emir Benarbia" }]
# Direct dependencies only. requirements.txt keeps the full pinned environment.
dependencies = [
    "langgraph",
    "openai",
    "psycopg2-binary",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "pyyaml",
    "sentence-transformers",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
claimverify-ingest = "claimverify.indexing.ingest:main"
claimverify-check = "claimverify.answering.query_check:main"
claimverify-draft = "claimverify.answering.drafting:main"
claimverify-decompose = "claimverify.answering.decomposition:main"
claimverify-verify = "claimverify.answering.verification:main"
claimverify-run = "claimverify.answering.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
